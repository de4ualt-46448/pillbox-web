services:
  - type: web
    name: pillbox-web
    runtime: node
    plan: free
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install && npx prisma generate
    startCommand: cd server && npx prisma db push --skip-generate && npx tsx src/index.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: MQTT_BROKER_URL
        value: mqtt://broker.hivemq.com:1883
      - key: CLIENT_ORIGIN
        sync: false
    healthCheckPath: /api/health

databases:
  - name: pillbox-db
    plan: free
    databaseName: pillbox
