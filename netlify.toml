# Netlify hosts both the Pillbox frontend and its Express API as a serverless function.

[build]
  command = "npm install --include=dev && npx prisma generate --schema server/prisma/schema.prisma && npm run build -w client"
  publish = "client/dist"

# Use a dedicated directory for Netlify Functions so the Firebase functions/
# folder is ignored; it is not compatible with Netlify's function runtime.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client", "prisma"]
  included_files = ["node_modules/.prisma/client/**"]

# Pin Node.js to the same major as .nvmrc (Vite 8 needs >= 20.19 / >= 22.12)
[build.environment]
  NODE_VERSION = "22"

# Send API requests to the serverless Express handler before the SPA fallback.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback: let react-router handle client-side routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
